
<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SHOPLY - Boutique</title>

<style>
*{box-sizing:border-box;margin:0;padding:0}

body{
  background:#09090e;
  color:white;
  font-family:Arial,sans-serif;
}

header{
  padding:22px 6%;
  display:flex;
  justify-content:space-between;
  align-items:center;
  border-bottom:1px solid #292333;
  position:sticky;
  top:0;
  background:#09090eee;
  z-index:5;
}

.logo{
  font-size:27px;
  font-weight:900;
  letter-spacing:2px;
}

.logo span{color:#a855f7}

header p{color:#aaa;font-size:13px}

.hero{
  padding:55px 6% 35px;
}

.hero h1{
  font-size:clamp(30px,5vw,48px);
  margin-bottom:12px;
}

.hero h1 span{color:#a855f7}

.hero p{color:#aaa}

.section{
  padding:20px 6% 60px;
}

.section h2{
  margin-bottom:25px;
  font-size:25px;
}

.products{
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(210px,1fr));
  gap:22px;
}

.product{
  background:#15121d;
  border:1px solid #30243d;
  border-radius:17px;
  overflow:hidden;
  cursor:pointer;
  transition:.25s;
}

.product:hover{
  transform:translateY(-5px);
  border-color:#a855f7;
}

.product-art{
  height:225px;
  display:flex;
  align-items:center;
  justify-content:center;
  background:linear-gradient(145deg,#21172d,#111019);
}

.product-art svg{
  width:80%;
  height:85%;
}

.product-info{padding:17px}

.product-info h3{margin-bottom:9px}

.price{
  color:#c084fc;
  font-weight:bold;
  font-size:19px;
}

.product-info small{
  display:block;
  color:#aaa;
  margin-top:8px;
}

/* FICHE PRODUIT */

.modal{
  display:none;
  position:fixed;
  inset:0;
  background:#000d;
  z-index:10;
  padding:20px;
  overflow-y:auto;
}

.modal.show{
  display:flex;
  justify-content:center;
  align-items:center;
}

.modal-content{
  background:#15121d;
  border:1px solid #553078;
  border-radius:20px;
  max-width:850px;
  width:100%;
  padding:25px;
  position:relative;
}

.close{
  position:absolute;
  top:15px;
  right:18px;
  background:#30243d;
  color:white;
  border:0;
  border-radius:50%;
  width:36px;
  height:36px;
  font-size:22px;
  cursor:pointer;
}

.details{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:30px;
  align-items:center;
}

.detail-art{
  min-height:330px;
  display:flex;
  justify-content:center;
  align-items:center;
  background:linear-gradient(145deg,#281b39,#100e16);
  border-radius:15px;
}

.detail-art svg{
  width:90%;
  height:320px;
}

.detail-text h2{
  font-size:28px;
  margin-bottom:12px;
}

.detail-price{
  color:#c084fc;
  font-size:25px;
  font-weight:bold;
  margin:15px 0;
}

.description{
  color:#bbb;
  line-height:1.7;
  font-size:14px;
}

.choice-title{
  margin:23px 0 12px;
  font-weight:bold;
}

.colors{
  display:flex;
  gap:12px;
  flex-wrap:wrap;
}

.color-btn{
  width:36px;
  height:36px;
  border-radius:50%;
  border:3px solid #444;
  cursor:pointer;
}

.color-btn.active{
  outline:2px solid #c084fc;
  outline-offset:3px;
}

.color-name{
  color:#c084fc;
  font-size:13px;
  margin-top:10px;
}

.sizes{
  display:flex;
  gap:9px;
  flex-wrap:wrap;
}

.size-btn{
  padding:10px 15px;
  background:#25202f;
  border:1px solid #494052;
  color:white;
  border-radius:8px;
  cursor:pointer;
}

.size-btn.active{
  background:#7627b6;
  border-color:#c084fc;
}

.add{
  width:100%;
  padding:15px;
  margin-top:25px;
  border:0;
  border-radius:10px;
  background:#9333ea;
  color:white;
  font-weight:bold;
  font-size:15px;
  cursor:pointer;
}

.add:hover{background:#a855f7}

footer{
  text-align:center;
  padding:30px;
  color:#777;
  border-top:1px solid #292333;
}

@media(max-width:650px){
  .details{grid-template-columns:1fr}
  .detail-art{min-height:260px}
  .detail-art svg{height:250px}
  .modal-content{padding:17px}
}
</style>
</head>

<body>

<header>
  <div class="logo">SHOP<span>LY</span></div>
  <p>La boutique nouvelle génération</p>
</header>

<section class="hero">
  <h1>Découvre notre <span>collection.</span></h1>
  <p>Mode, style et nouveautés. Trouve ton prochain look.</p>
</section>

<section class="section">
  <h2>Notre sélection</h2>
  <div class="products" id="products"></div>
</section>

<div class="modal" id="modal" onclick="outsideClose(event)">
  <div class="modal-content">
    <button class="close" onclick="closeProduct()">×</button>

    <div class="details">
      <div class="detail-art" id="detailArt"></div>

      <div class="detail-text">
        <h2 id="detailName"></h2>
        <div class="detail-price" id="detailPrice"></div>
        <p class="description" id="detailDescription"></p>

        <div class="choice-title">Choisis ta couleur</div>
        <div class="colors" id="colorChoices"></div>
        <div class="color-name" id="colorName"></div>

        <div class="choice-title">Choisis ta taille</div>
        <div class="sizes" id="sizeChoices"></div>

        <button class="add" onclick="addToCart()">
          Ajouter au panier
        </button>
        <p id="message" style="color:#c084fc;margin-top:12px;font-size:13px"></p>
      </div>
    </div>
  </div>
</div>

<footer>
  SHOPLY © 2026 - Ton univers shopping
</footer>

<script>
const productsData = [
 {
  id:1,
  name:"Sweat Oversize",
  price:29.99,
  type:"hoodie",
  description:"Un sweat oversize au style streetwear. Matière douce, coupe ample et poche kangourou. Idéal pour un look confortable au quotidien.",
  colors:[
   {name:"Noir",hex:"#242329"},
   {name:"Blanc",hex:"#eee9e5"},
   {name:"Violet",hex:"#8438bd"},
   {name:"Gris",hex:"#85858c"}
  ]
 },
 {
  id:2,
  name:"T-shirt Essential",
  price:19.99,
  type:"shirt",
  description:"Un t-shirt essentiel avec une coupe moderne. Facile à associer avec tes tenues préférées.",
  colors:[
   {name:"Noir",hex:"#242329"},
   {name:"Blanc",hex:"#eee9e5"},
   {name:"Violet",hex:"#8438bd"},
   {name:"Vert",hex:"#4d8060"}
  ]
 },
 {
  id:3,
  name:"Jogging Street",
  price:34.99,
  type:"pants",
  description:"Un jogging confortable avec une coupe moderne. Parfait pour compléter un ensemble streetwear.",
  colors:[
   {name:"Noir",hex:"#242329"},
   {name:"Gris",hex:"#85858c"},
   {name:"Beige",hex:"#c5aa87"},
   {name:"Violet",hex:"#8438bd"}
  ]
 },
 {
  id:4,
  name:"Hoodie Premium",
  price:39.99,
  type:"hoodie",
  description:"Un hoodie premium au design minimaliste. Une pièce polyvalente pour un style moderne.",
  colors:[
   {name:"Noir",hex:"#242329"},
   {name:"Blanc",hex:"#eee9e5"},
   {name:"Bleu",hex:"#405c9c"},
   {name:"Bordeaux",hex:"#792d46"}
  ]
 }
];

let currentProduct = null;
let currentColor = 0;
let currentSize = "";
let cart = [];

function garment(type,color){
 let shape = "";

 if(type==="hoodie"){
  shape = `
   <path d="M115 80 L155 58 Q180 95 200 95 Q220 95 245 58 L285 80 L330 145 L290 170 L270 145 L270 350 L130 350 L130 145 L110 170 L70 145 Z"
   fill="${color}" stroke="#ffffff55" stroke-width="4"/>
   <path d="M155 58 Q150 12 200 12 Q250 12 245 58 L230 105 L170 105 Z"
   fill="${color}" stroke="#ffffff66" stroke-width="4"/>
   <path d="M175 105 L175 160 M225 105 L225 160" stroke="#ffffff55" stroke-width="4"/>
   <path d="M155 255 L245 255 L245 305 L155 305 Z" fill="#00000020" stroke="#ffffff55" stroke-width="3"/>
   <path d="M200 160 L200 215" stroke="#ffffff55" stroke-width="3"/>
  `;
 }else if(type==="shirt"){
  shape = `
   <path d="M125 75 L165 55 Q200 95 235 55 L275 75 L330 140 L285 180 L255 145 L255 350 L145 350 L145 145 L115 180 L70 140 Z"
   fill="${color}" stroke="#ffffff55" stroke-width="4"/>
   <path d="M165 55 Q170 105 200 105 Q230 105 235 55" fill="none" stroke="#ffffff66" stroke-width="5"/>
  `;
 }else{
  shape = `
   <path d="M135 20 L190 20 L200 45 L210 20 L265 20 L290 350 L220 350 L200 185 L180 350 L110 350 Z"
   fill="${color}" stroke="#ffffff55" stroke-width="4"/>
   <path d="M200 45 L200 350" stroke="#ffffff66" stroke-width="4"/>
  `;
 }

 return `
 <svg viewBox="0 0 400 380" xmlns="http://www.w3.org/2000/svg">
  <ellipse cx="200" cy="355" rx="115" ry="12" fill="#00000035"/>
  ${shape}
  <text x="200" y="230" text-anchor="middle"
   fill="#ffffffaa" font-size="19" font-weight="bold"
   letter-spacing="3">SHOPLY</text>
 </svg>`;
}

function renderProducts(){
 const container = document.getElementById("products");

 container.innerHTML = productsData.map(p=>`
  <div class="product" onclick="openProduct(${p.id})">
   <div class="product-art">
    ${garment(p.type,p.colors[0].hex)}
   </div>
   <div class="product-info">
    <h3>${p.name}</h3>
    <div class="price">${p.price.toFixed(2)} €</div>
    <small>${p.colors.length} couleurs disponibles · Voir le produit →</small>
   </div>
  </div>
 `).join("");
}

function openProduct(id){
 currentProduct = productsData.find(p=>p.id===id);
 currentColor = 0;
 currentSize = "";

 document.getElementById("modal").classList.add("show");
 document.getElementById("detailName").textContent=currentProduct.name;
 document.getElementById("detailPrice").textContent=currentProduct.price.toFixed(2)+" €";
 document.getElementById("detailDescription").textContent=currentProduct.description;
 document.getElementById("message").textContent="";

 renderColors();
 renderSizes();
 updateProductImage();
}

function renderColors(){
 const container=document.getElementById("colorChoices");

 container.innerHTML=currentProduct.colors.map((c,i)=>`
  <button
   class="color-btn ${i===currentColor?'active':''}"
   style="background:${c.hex}"
   title="${c.name}"
   aria-label="${c.name}"
   onclick="selectColor(${i})">
  </button>
 `).join("");

 document.getElementById("colorName").textContent=
 "Couleur sélectionnée : "+currentProduct.colors[currentColor].name;
}

function selectColor(index){
 currentColor=index;
 renderColors();
 updateProductImage();
}

function updateProductImage(){
 const color=currentProduct.colors[currentColor];
 document.getElementById("detailArt").innerHTML=
 garment(currentProduct.type,color.hex);
}

function renderSizes(){
 const sizes=["XS","S","M","L","XL"];

 document.getElementById("sizeChoices").innerHTML=
 sizes.map(s=>`
  <button class="size-btn ${currentSize===s?'active':''}"
   onclick="selectSize('${s}')">${s}</button>
 `).join("");
}

function selectSize(size){
 currentSize=size;
 renderSizes();
}

function addToCart(){
 if(!currentSize){
  document.getElementById("message").textContent=
  "Choisis une taille avant de continuer.";
  return;
 }

 const color=currentProduct.colors[currentColor];

 cart.push({
  name:currentProduct.name,
  color:color.name,
  size:currentSize,
  price:currentProduct.price
 });

 document.getElementById("message").textContent=
 "✓ Produit ajouté au panier !";
}

function closeProduct(){
 document.getElementById("modal").classList.remove("show");
}

function outsideClose(event){
 if(event.target.id==="modal") closeProduct();
}

renderProducts();
</script>

</body>
 </html>
